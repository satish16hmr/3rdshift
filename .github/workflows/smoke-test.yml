name: Smoke Tests

# Triggered in two ways:
#   1. Vercel deployment completed → deployment_status event (automatic, no webhook setup needed)
#      Vercel creates deployment_status events on the GitHub repo on every deploy.
#   2. Manual trigger from GitHub Actions UI (useful for debugging)
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL to test (default: https://3rdshift.ai)'
        required: false
        default: 'https://3rdshift.ai'

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on successful Vercel Production deploys (skip preview deploys and failures)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment_status.environment == 'Production'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url || github.event.client_payload.url || inputs.base_url || 'https://3rdshift.ai' }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
        run: npx playwright test --config playwright.config.ts

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Notify JR on failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.SMOKE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SMOKE_TELEGRAM_CHAT_ID }}
          DEPLOY_URL: ${{ github.event.deployment_status.target_url || github.event.client_payload.url || 'https://3rdshift.ai' }}
        run: |
          MESSAGE="🚨 *Smoke tests FAILED* after deploy%0A%0ATarget: ${DEPLOY_URL}%0ARun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"

      - name: Notify JR on success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.SMOKE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SMOKE_TELEGRAM_CHAT_ID }}
          DEPLOY_URL: ${{ github.event.deployment_status.target_url || github.event.client_payload.url || 'https://3rdshift.ai' }}
        run: |
          MESSAGE="✅ *Smoke tests passed* — deploy looks good%0A%0ATarget: ${DEPLOY_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
